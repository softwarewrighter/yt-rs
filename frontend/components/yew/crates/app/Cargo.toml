[package]
name = "yt-rs-yew-app"
version = "0.1.0"
edition = "2024"
authors = ["Mike <mike@softwarewrighter.com>"]
license = "MIT"
description = "Yew/WASM frontend for yt-rs node editor"

[dependencies]
yt-rs-shared = { path = "../../../../../shared/components/shared" }

yew = { version = "0.21", features = ["csr"] }
gloo = "0.11"
gloo-net = "0.5"
web-sys = { version = "0.3", features = ["FormData", "File", "FileList", "Blob", "Element", "DomRect"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
log = "0.4"
wasm-logger = "0.2"
