# yt-rs Configuration File
# Copy to config.toml and customize as needed.
#
# Usage: ./scripts/run.sh -c config.toml
#        yt-rs serve -c config.toml

[generate_dialog]
# Ollama server hostname
ollama_host = "big72"

# Ollama server port
ollama_port = 11434

# Vision model for analyzing still images
vision_model = "llama3.2-vision:11b"

# System prompt for the vision model - customize for your project type
system_prompt = """
You are an expert in analyzing screencast stills showing a developer
interacting with Claude Code CLI Coding Agent in a terminal working on
a github/softwarewrighter project. The extracted still images may show
terminal and/or browser being used on a remote Linux desktop.

Focus on:
- What the developer is doing (coding, debugging, reviewing)
- Any visible code, commands, or output
- The tools and interfaces shown
- Progress or results being demonstrated
"""

[workspace]
# Default project name for save/restore
default_project_name = "default"
