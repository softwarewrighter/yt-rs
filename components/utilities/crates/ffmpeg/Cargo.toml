[package]
name = "yt-rs-ffmpeg"
version = "0.1.0"
edition = "2024"
authors = ["Mike <mike@softwarewrighter.com>"]
license = "MIT"
description = "FFmpeg utilities for yt-rs video processing"

[dependencies]
thiserror = "1.0"
tokio = { version = "1.0", features = ["process", "io-util"] }
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
