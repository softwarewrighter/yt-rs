[package]
name = "yt-rs-crud"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1", features = ["fs"] }
uuid = { version = "1.13", features = ["v4", "serde"] }
yt-rs-shared = { path = "../../../shared/components/shared" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
