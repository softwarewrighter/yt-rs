[package]
name = "yt-rs-rest"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.13", features = ["v4", "serde"] }
yt-rs-server = { path = "../server" }

[dev-dependencies]
tempfile = "3"
